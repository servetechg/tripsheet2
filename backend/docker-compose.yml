services:
  postgres:
    image: postgres:16-alpine
    container_name: tripsheet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tripsheet
      POSTGRES_PASSWORD: tripsheet
      POSTGRES_DB: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tripsheet']
      interval: 5s
      timeout: 5s
      retries: 10

  # Phase 3: connection pooler for many fq_tenant_* databases.
  # App runtime URLs should use port 6432; CREATE DATABASE (provision) still uses 5432.
  pgbouncer:
    image: edoburu/pgbouncer:1.22.1-p0
    container_name: tripsheet-pgbouncer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_USER: tripsheet
      DB_PASSWORD: tripsheet
      DB_HOST: postgres
      DB_PORT: 5432
      AUTH_TYPE: plain
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 20
      MIN_POOL_SIZE: 2
      RESERVE_POOL_SIZE: 5
      SERVER_RESET_QUERY: DISCARD ALL
      ADMIN_USERS: tripsheet
    ports:
      - '6432:5432'

  redis:
    image: redis:7-alpine
    container_name: tripsheet-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
