name: Frontend Firebase build args
description: Pass VITE_FIREBASE_* into Docker build (values from workflow inputs)
inputs:
  vite_firebase_api_key:
    required: false
    default: ''
  vite_firebase_auth_domain:
    required: false
    default: ''
  vite_firebase_project_id:
    required: false
    default: ''
  vite_firebase_storage_bucket:
    required: false
    default: ''
  vite_firebase_messaging_sender_id:
    required: false
    default: ''
  vite_firebase_app_id:
    required: false
    default: ''
  vite_firebase_measurement_id:
    required: false
    default: ''
  vite_firebase_vapid_key:
    required: false
    default: ''
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        cat >> "$GITHUB_ENV" <<EOF
        FRONTEND_BUILD_ARGS<<BUILDARGS
        VITE_API_URL=/api
        VITE_FIREBASE_API_KEY=${{ inputs.vite_firebase_api_key }}
        VITE_FIREBASE_AUTH_DOMAIN=${{ inputs.vite_firebase_auth_domain }}
        VITE_FIREBASE_PROJECT_ID=${{ inputs.vite_firebase_project_id }}
        VITE_FIREBASE_STORAGE_BUCKET=${{ inputs.vite_firebase_storage_bucket }}
        VITE_FIREBASE_MESSAGING_SENDER_ID=${{ inputs.vite_firebase_messaging_sender_id }}
        VITE_FIREBASE_APP_ID=${{ inputs.vite_firebase_app_id }}
        VITE_FIREBASE_MEASUREMENT_ID=${{ inputs.vite_firebase_measurement_id }}
        VITE_FIREBASE_VAPID_KEY=${{ inputs.vite_firebase_vapid_key }}
        BUILDARGS
        EOF
