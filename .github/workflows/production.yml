name: production

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      color:
        description: 'Target color (blue/green). Leave empty to auto-pick inactive.'
        required: false
        default: ''

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.sha }}
      image_registry: ${{ steps.meta.outputs.registry }}
    steps:
      - name: Image meta
        id: meta
        run: |
          REPO_LC="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "registry=${{ env.REGISTRY }}/${REPO_LC}" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: gateway
            context: .
            file: backend/gateway/Dockerfile
          - name: frontend
            context: .
            file: frontend/Dockerfile
            build_args: VITE_API_URL=/api
          - name: auth-service
            context: .
            file: backend/services/auth-service/Dockerfile
          - name: company-service
            context: .
            file: backend/services/company-service/Dockerfile
          - name: driver-service
            context: .
            file: backend/services/driver-service/Dockerfile
          - name: fleet-service
            context: .
            file: backend/services/fleet-service/Dockerfile
          - name: manifest-service
            context: .
            file: backend/services/manifest-service/Dockerfile
          - name: tripsheet-service
            context: .
            file: backend/services/tripsheet-service/Dockerfile
          - name: accounting-service
            context: .
            file: backend/services/accounting-service/Dockerfile
          - name: notification-service
            context: .
            file: backend/services/notification-service/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-buildx-retry

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pre-pull base images (Docker Hub flake guard)
        run: |
          set -euo pipefail
          pull_retry() {
            local img="$1"
            local i
            for i in 1 2 3 4 5; do
              if docker pull "$img"; then
                echo "pulled ${img}"
                return 0
              fi
              echo "pull ${img} attempt ${i} failed — retrying..."
              sleep $((i * 10))
            done
            echo "ERROR: could not pull ${img}"
            return 1
          }
          pull_retry node:20-alpine
          if [[ "${{ matrix.name }}" == "frontend" ]]; then
            pull_retry nginx:1.27-alpine
          fi

      - name: Build & push ${{ matrix.name }} (attempt 1)
        id: build1
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          build-args: ${{ matrix.build_args || '' }}
          tags: |
            ${{ needs.meta.outputs.image_registry }}/${{ matrix.name }}:${{ needs.meta.outputs.image_tag }}
            ${{ needs.meta.outputs.image_registry }}/${{ matrix.name }}:latest
          cache-from: type=gha,scope=prod-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=prod-${{ matrix.name }}

      - name: Build & push ${{ matrix.name }} (attempt 2)
        id: build2
        if: steps.build1.outcome == 'failure'
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          build-args: ${{ matrix.build_args || '' }}
          tags: |
            ${{ needs.meta.outputs.image_registry }}/${{ matrix.name }}:${{ needs.meta.outputs.image_tag }}
            ${{ needs.meta.outputs.image_registry }}/${{ matrix.name }}:latest
          cache-from: type=gha,scope=prod-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=prod-${{ matrix.name }}

      - name: Build & push ${{ matrix.name }} (attempt 3)
        id: build3
        if: steps.build1.outcome == 'failure' && steps.build2.outcome == 'failure'
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          build-args: ${{ matrix.build_args || '' }}
          tags: |
            ${{ needs.meta.outputs.image_registry }}/${{ matrix.name }}:${{ needs.meta.outputs.image_tag }}
            ${{ needs.meta.outputs.image_registry }}/${{ matrix.name }}:latest
          cache-from: type=gha,scope=prod-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=prod-${{ matrix.name }}

      - name: Verify image build
        if: always()
        run: |
          if [[ "${{ steps.build1.outcome }}" == "success" \
             || "${{ steps.build2.outcome }}" == "success" \
             || "${{ steps.build3.outcome }}" == "success" ]]; then
            echo "Build succeeded for ${{ matrix.name }}"
            exit 0
          fi
          echo "All build attempts failed for ${{ matrix.name }}"
          exit 1

  deploy:
    needs: [meta, build-and-push]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          IMAGE_TAG: ${{ needs.meta.outputs.image_tag }}
          IMAGE_REGISTRY: ${{ needs.meta.outputs.image_registry }}
          REQUESTED_COLOR: ${{ github.event.inputs.color }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ secrets.GHCR_USERNAME || github.actor }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null key
          printf '%s\n' "$SSH_KEY" > key
          COLOR="${REQUESTED_COLOR:-}"
          if [[ -z "${COLOR}" ]]; then
            COLOR=$(ssh -i key -o StrictHostKeyChecking=accept-new "${VPS_USER}@${VPS_HOST}" \
              'grep -E "^ACTIVE_COLOR=" /opt/tripsheet/secrets/edge.env 2>/dev/null | cut -d= -f2 || echo blue')
            if [[ "${COLOR}" == "blue" ]]; then COLOR=green; else COLOR=blue; fi
          fi
          ssh -i key -o StrictHostKeyChecking=accept-new "${VPS_USER}@${VPS_HOST}" bash -s <<EOF
          set -euo pipefail
          cd /opt/tripsheet/repo
          git fetch --all
          git checkout --force ${GITHUB_SHA}
          chmod +x deploy/scripts/*.sh
          export CI_COMMIT_SHA=${GITHUB_SHA}
          export IMAGE_REGISTRY=${IMAGE_REGISTRY}
          export IMAGE_TAG=${IMAGE_TAG}
          echo '${GHCR_TOKEN}' | docker login ghcr.io -u '${GHCR_USER}' --password-stdin
          ./deploy/scripts/ci-production-deploy.sh '${COLOR}' '${IMAGE_TAG}'
          EOF
